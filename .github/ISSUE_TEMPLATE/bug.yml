name: Bug report
description: Report reproducible behaviour that appears incorrect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve a RouteFoundry Technologies project. Do not include credentials, personal information or vulnerability details in a public issue. Security-sensitive findings should follow the repository or organization SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Give a concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Relevant browser, OS, runtime, version, deployment or device information.
      placeholder: e.g. Windows 11, Node 22, Chrome 151

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add safe logs, screenshots or error messages if useful. Remove secrets and personal data first.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not contain secrets, credentials, private customer data or vulnerability details.
          required: true
